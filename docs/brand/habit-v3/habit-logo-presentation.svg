<text x="584" y="781" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#183C32" font-weight="600">Rumah dengan monogram H.</text>
<text x="584" y="815" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#60756C" font-weight="400">Menekankan ruang keluarga yang tertata.</text>
<text x="584" y="843" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#60756C" font-weight="400">Lebih dekat dengan ikon sebelumnya.</text>
<text x="1080" y="605" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#536B61" font-weight="700">03 / TUMBUH BERSAMA</text>
<g transform="translate(1088 634) scale(1.65)"><g fill="none" stroke="#007F5B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M32 55V36C18 38 9 29 11 16c13-1 21 7 21 20 0-13 9-21 22-20 1 13-8 22-22 20"/></g><circle cx="32" cy="12" r="5" fill="#F5B942"/></g>
<text x="1080" y="781" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#183C32" font-weight="600">Dua bentuk tumbuh dari satu pusat.</text>
<text x="1080" y="815" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#60756C" font-weight="400">Menekankan perkembangan dan kebiasaan.</text>
<text x="1080" y="843" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#60756C" font-weight="400">Lebih organik dan ekspresif.</text>
<text x="64" y="957" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#60756C" font-weight="700">PALET / KELUARGA, KEHANGATAN, KEJELASAN</text>
