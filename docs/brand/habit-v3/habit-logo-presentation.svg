<text x="88" y="605" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#007F5B" font-weight="700">01 / HADIR BERSAMA</text>
<g transform="translate(96 634) scale(1.65)"><g fill="none" stroke="#007F5B" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><path d="M14 20v30M50 20v30"/><path d="M14 32c9 13 27 13 36 0"/></g><circle cx="32" cy="18" r="5.5" fill="#F5B942"/></g>
<text x="88" y="781" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#183C32" font-weight="600">H sebagai inisial Habit.</text>
<text x="88" y="815" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#60756C" font-weight="400">Dua sisi terhubung; satu pusat perhatian.</text>
<text x="88" y="843" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#60756C" font-weight="400">Hangat, sederhana, mudah dikenali.</text>
<rect x="88" y="867" width="114" height="23" rx="11" fill="#E7F3EC"/><text x="100" y="883" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#007F5B" font-weight="700">DIREKOMENDASIKAN</text>
<text x="584" y="605" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#536B61" font-weight="700">02 / RITME RUMAH</text>
