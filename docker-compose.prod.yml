# ─────────────────────────────────────────────────────────
#  docker-compose.prod.yml  —  Production stack
#
#  Cara pakai:
#    docker compose -f docker-compose.prod.yml up -d
#
#  Environment:
#    Buat file .env di root project (lihat .env.example)
#    atau inject melalui CI/CD secrets.
# ─────────────────────────────────────────────────────────

services:

  # ─── Redis ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: habit_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  # ─── MinIO (Object Storage) ─────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: habit_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - backend-net

  # ─── Backend (Golang) ───────────────────────────────────
  # PostgreSQL tidak dijalankan via Docker — pakai DB yang sudah ada di VPS.
  # Set DB_HOST ke IP/hostname VPS di .env
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY}/habit-backend:${IMAGE_TAG:-latest}
    container_name: habit_backend
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      APP_ENV: production
      APP_PORT: 8080
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL_MODE: ${DB_SSL_MODE:-disable}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: 0
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: ${BACKEND_URL}/api/v1/auth/google/callback
      FRONTEND_BASE_URL: ${FRONTEND_URL}
      STORAGE_ENDPOINT: minio:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-keluarga}
      STORAGE_USE_SSL: "false"
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@keluarga.dev}
      NOTIFICATION_TIME: ${NOTIFICATION_TIME:-0 4 * * *}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend-net
      - frontend-net

  # ─── Frontend (Next.js) ─────────────────────────────────
  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY}/habit-frontend:${IMAGE_TAG:-latest}
    container_name: habit_frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${BACKEND_URL}/api/v1
      NEXT_PUBLIC_APP_URL: ${FRONTEND_URL}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
    depends_on:
      - backend
    networks:
      - frontend-net

volumes:
  redis-data:
  minio-data:

networks:
  backend-net:
    driver: bridge
  frontend-net:
    driver: bridge
